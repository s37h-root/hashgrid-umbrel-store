version: "3.7"

services:
  app:
    image: ghcr.io/s37h-root/hashgrid-bridge:v1.0.10
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR:-./data}:/data
    environment:
      - DATA_DIR=/data
      - PORT=3000

  widget-server:
    image: ghcr.io/s37h-root/hashgrid-bridge-widget:v1.0.0
    restart: on-failure
    environment:
      - BRIDGE_URL=http://app:3000
      - PORT=3001
