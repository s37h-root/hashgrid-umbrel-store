manifestVersion: 1.1
id: s37h-root-hashgrid-bridge
category: bitcoin
name: HashGrid Bridge
version: "1.0.2"
tagline: Remote miner monitoring bridge for the HashGrid iOS app
description: >-
  HashGrid Bridge connects your local Bitcoin miners to the HashGrid iOS app
  for remote monitoring. It scans your local network for BitAxe, Canaan, and
  other cgminer-compatible miners, then securely relays their status to your
  phone over an end-to-end encrypted connection.

  Simply install the bridge, open it to see your pairing code, and enter the
  code in the HashGrid iOS app. Your miners will appear in the app instantly,
  no port forwarding or VPN required.
icon: https://raw.githubusercontent.com/s37h-root/hashgrid-umbrel-store/main/s37h-root-hashgrid-bridge/icon.svg
developer: HashGrid
website: https://hashgrid.app
repo: https://github.com/s37h-root/hashgrid-umbrel
support: https://github.com/s37h-root/hashgrid-umbrel/issues
port: 3000
dependencies: []
gallery:
  - https://raw.githubusercontent.com/s37h-root/hashgrid-umbrel-store/main/s37h-root-hashgrid-bridge/gallery/1.jpg
  - https://raw.githubusercontent.com/s37h-root/hashgrid-umbrel-store/main/s37h-root-hashgrid-bridge/gallery/2.jpg
releaseNotes: "v1.0.2 — fixes cgminer-protocol devices (Avalon Nano 3S, Avalon Q, Antminer-on-cgminerTCP) showing offline over remote. Adds full action surface: LED control, fan speed (with smart-speed companion), pool config (configure / switch / rotate), and Antminer CGI pool config via HTTP Digest auth. Also handles non-default cgminer ports (e.g. :4029)."
submitter: s37h-root
widgets:
  - id: "status"
    type: "four-stats"
    refresh: "30s"
    endpoint: "widget-server:3001/widgets/status"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Pairing Code"
          text: "ABC12DEF"
          subtext: ""
        - title: "Relay"
          text: "Connected"
          subtext: ""
        - title: "Miners"
          text: "3"
          subtext: "found"
        - title: "Peer"
          text: "Online"
          subtext: ""
